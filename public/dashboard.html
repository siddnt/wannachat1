<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wannaChat — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">wannaChat</h1>
    <div class="flex items-center gap-4">
      <span id="user-greeting" class="text-sm text-slate-400"></span>
      <button class="leave-btn text-sm bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-4 py-2 rounded-lg transition">Logout</button>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-2xl mx-auto px-4 py-10">
    <!-- Create Room -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-8">
      <h2 class="text-lg font-semibold text-slate-200 mb-4">Create a Room</h2>
      <div class="flex gap-3">
        <input type="text" id="message-input" placeholder="Room name"
               class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        <button class="create-room bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition">Create</button>
        <button class="see-room bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-medium px-5 py-2.5 rounded-lg text-sm transition">Refresh</button>
      </div>
      <div class="error-text text-red-400 text-sm mt-3"></div>
    </div>

    <!-- Room List -->
    <div class="chatRoomList">
      <h2 class="roomListTitle text-lg font-semibold text-slate-200 mb-4 hidden">Available Rooms</h2>
      <ul id="room-list" class="space-y-2"></ul>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
