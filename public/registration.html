<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wannaChat — Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm mx-auto px-4">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">wannaChat</h1>
      <p class="text-slate-500 mt-1 text-sm">Create your account</p>
    </div>

    <form class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5 shadow-xl">
      <div>
        <label for="name" class="block text-sm font-medium text-slate-400 mb-1.5">Display Name</label>
        <input type="text" id="name" placeholder="What should we call you?"
               class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-slate-400 mb-1.5">Email</label>
        <input type="email" id="email" placeholder="you@example.com"
               class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-400 mb-1.5">Password</label>
        <input type="password" id="password" placeholder="••••••••"
               class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>
      <button type="submit" class="btn-register w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold py-2.5 rounded-lg transition-all duration-200 shadow-lg shadow-blue-500/20">
        Create Account
      </button>
      <div class="error-text text-center text-red-400 text-sm"></div>
      <p class="text-center text-sm text-slate-500">
        Already have an account? <a href="index.html" class="text-blue-400 hover:text-blue-300 font-medium">Sign In</a>
      </p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/authRegistration.js"></script>
</body>
</html>
