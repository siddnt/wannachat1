version: '3.8'

services:
  mongo:
    image: 'mongo:7'
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'

  node-app:
    build:
      dockerfile: DockerfileServer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongo
      - redis

  nginx:
    image: 'nginx:alpine'
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-app

volumes:
  mongo-data: