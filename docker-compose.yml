version: '3.8'

services:
  mongo:
    image: 'mongo:7'
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'

  node-app:
    build:
      dockerfile: DockerfileServer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 8s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: 'nginx:alpine'
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-app

  autoheal:
    image: willfarrell/autoheal:latest
    tty: true
    restart: always
    environment:
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=15
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mongo-data: